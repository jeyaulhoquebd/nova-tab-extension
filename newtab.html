<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <div id="bgImg" class="bg-img" aria-hidden="true"></div>

  <div id="focusBanner" class="focus-banner" hidden>
    <span>🎯 Focus Mode is on · <strong id="focusLeft">--:--</strong> left</span>
    <button id="focusEnd" type="button">End</button>
  </div>

  <div class="toolbar">
    <button id="btnFocus" class="tool-btn" type="button" title="Focus Mode">🎯 <span>Focus</span></button>
    <button id="btnSessions" class="tool-btn" type="button" title="Tab sessions">🗂️ <span>Sessions</span></button>
    <button id="btnCgpa" class="tool-btn" type="button" title="CGPA calculator">🎓 <span>CGPA</span></button>
    <button id="btnSettings" class="tool-btn" type="button" title="Settings">⚙️ <span>Settings</span></button>
  </div>

  <main>
    <section class="clock">
      <div class="time-row">
        <span id="time" class="time">--:--</span>
        <span class="time-side">
          <span id="seconds" class="seconds">00</span>
          <span id="ampm" class="ampm">AM</span>
        </span>
      </div>
      <div id="date" class="date"></div>
      <div id="greeting" class="greeting"></div>
      <div class="tz">Bangladesh Standard Time (GMT+6)</div>
    </section>

    <div class="search-wrap">
      <form id="searchForm" class="search" autocomplete="off">
        <img id="engineIcon" class="engine-icon" alt="">
        <input id="q" type="text" placeholder="Search the web…" spellcheck="false" autofocus>
        <button type="button" id="promptBtn" class="icon-btn" title="Prompt library" aria-label="Prompt library">✨</button>
        <button type="submit" class="go" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
      </form>
      <div id="promptPanel" class="panel" hidden></div>
    </div>

    <nav id="engines" class="engines" aria-label="Search engines"></nav>
    <p id="hint" class="hint"></p>

    <section class="shortcuts"><div id="shortcuts"></div></section>

    <section id="dashboard" class="dashboard"></section>
  </main>

  <footer class="themes">
    <span class="themes-label">Theme</span>
    <div id="swatches" class="swatches"></div>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <dialog id="formDialog"><form id="formDialogForm" class="dialog-inner" autocomplete="off"></form></dialog>
  <dialog id="bigDialog" class="big">
    <div class="dialog-inner">
      <div class="big-head"><h2 id="bigTitle"></h2><button id="bigClose" type="button" class="tool" aria-label="Close">✕</button></div>
      <div id="bigBody"></div>
    </div>
  </dialog>

  <script src="common.js"></script>
  <script src="clock.js"></script>
  <script src="search.js"></script>
  <script src="prompts.js"></script>
  <script src="shortcuts.js"></script>
  <script src="pomodoro.js"></script>
  <script src="planner.js"></script>
  <script src="world.js"></script>
  <script src="cgpa.js"></script>
  <script src="focus.js"></script>
  <script src="sessions.js"></script>
  <script src="settings.js"></script>
  <script src="main.js"></script>
</body>
</html>
