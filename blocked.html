<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked · Focus Mode</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <div class="icon">🎯</div>
    <h1>Stay focused</h1>
    <p>This site is blocked by <strong>Focus Mode</strong>.</p>
    <p class="left">Time left: <strong id="left">--:--</strong></p>
    <div class="row">
      <button id="back" type="button">Go back</button>
      <button id="end" type="button" class="ghost">End Focus Mode</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
